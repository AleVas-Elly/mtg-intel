[project]
name = "mtg-intel"
version = "0.1.0"
description = "MTG price archive and buy-timing engines"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "ijson>=3.6.0",
    "pyarrow>=26.0.0",
    "zstandard>=0.25.0",
]

[project.scripts]
mtg-intel = "mtg_intel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

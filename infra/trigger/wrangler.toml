name = "mtg-intel-trigger"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = false

[triggers]
crons = ["2,7,12,17,22,27,32,37,42,47,52,57 * * * *", "17 2,8,14 * * *", "* * * * *"]

# The website's KV (frontend/wrangler.toml).
[[kv_namespaces]]
binding = "DATA"
id = "fe194e1ee4754791801ac6024a93905a"

# The website's D1 (D67): the edit queue (D50), the time of
# the last deal check and the fast-lane list (in `docs` and `meta`), the watchdog.
[[d1_databases]]
binding = "DB"
database_name = "mtg-intel"
database_id = "223f438f-678c-48cf-8fa9-d6679a7668da"

# The website Worker's Notify entrypoint (D88): alerts for the Alerts page and the phone pings.
# RPC through this binding only, never a public URL.
[[services]]
binding = "SITE"
service = "mtg-intel"
entrypoint = "Notify"

[observability]
enabled = true

[vars]
GITHUB_REPO = "AleVas-Elly/mtg-intel"

# Secrets (wrangler secret put): GITHUB_TOKEN (fine-grained, this repo only, Actions: read and write),
# CARDTRADER_TOKEN (the fast lane, D58, and Check CardTrader, D83).

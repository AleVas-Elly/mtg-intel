name = "mtg-intel-trigger"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = false

[triggers]
crons = ["7,17,27,37,47,57 * * * *", "17 2,8,14 * * *"]

# The website's KV (frontend/wrangler.toml): read only, to see want-list edits waiting (D50).
[[kv_namespaces]]
binding = "DATA"
id = "fe194e1ee4754791801ac6024a93905a"

[vars]
GITHUB_REPO = "AleVas-Elly/mtg-intel"

# Secrets (wrangler secret put): GITHUB_TOKEN (fine-grained, this repo only, Actions: read and write),
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
